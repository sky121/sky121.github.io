     resolves to `unknown`, which alerts. -->

      "offers":{"@type":"Offer","price":"1096.95","priceCurrency":"USD","availability":"https://schema.org/BackOrder"} }
    </script>
  </head>
  <body><h1>Camera Body — Sand Beige</h1><button>Backorder now</button></body>
</html>
